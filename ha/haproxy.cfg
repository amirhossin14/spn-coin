#=============================================================================
#  HAProxy — Sepanta (SPN) High-Availability Load Balancer
#
#  Spreads traffic across node1/node2/node3. If a node fails its health check
#  it is taken out of rotation automatically and put back when it recovers, so
#  a single node crashing never takes the service down. Add more `server` lines
#  to scale horizontally.
#=============================================================================

global
    log stdout format raw local0 info
    maxconn 50000
    tune.ssl.default-dh-param 2048
    # Drop privileges after binding
    user  haproxy
    group haproxy

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    option  http-server-close
    option  redispatch          # resend to another server if one dies mid-request
    retries 3
    timeout connect 5s
    timeout client  50s
    timeout server  50s
    timeout http-request 10s
    timeout http-keep-alive 2s
    default-server inter 3s fall 3 rise 2   # health: check every 3s, down after 3 fails

#-----------------------------------------------------------------------------
#  Stats dashboard (http://<host>:8404/)  — watch node health live
#-----------------------------------------------------------------------------
frontend stats
    bind *:8404
    stats enable
    stats uri /
    stats refresh 5s
    stats show-node
    stats show-legends

#-----------------------------------------------------------------------------
#  HTTP  (port 80) — redirect everything to HTTPS
#-----------------------------------------------------------------------------
frontend http_in
    bind *:80
    # Let ACME/health checks through on plain HTTP, redirect the rest to TLS
    acl is_health path /api/health
    http-request redirect scheme https code 301 unless is_health { ssl_fc }
    default_backend spn_nodes

#-----------------------------------------------------------------------------
#  HTTPS (port 443) — terminate TLS, load-balance to the nodes
#  Put a real cert in ha/certs/spn.pem (fullchain + key concatenated).
#-----------------------------------------------------------------------------
frontend https_in
    bind *:443 ssl crt /usr/local/etc/haproxy/certs/ alpn h2,http/1.1
    http-request set-header X-Forwarded-Proto https
    http-request set-header X-Forwarded-For %[src]
    # Sticky sessions by cookie so a user keeps hitting the same node when it helps
    default_backend spn_nodes

#-----------------------------------------------------------------------------
#  Backend: the SPN nodes. `check` uses /api/health; a failing node is removed.
#-----------------------------------------------------------------------------
backend spn_nodes
    balance roundrobin
    option httpchk GET /api/health
    http-check expect status 200
    cookie SPNSRV insert indirect nocache
    server node1 node1:3000 check cookie n1
    server node2 node2:3000 check cookie n2
    server node3 node3:3000 check cookie n3

#-----------------------------------------------------------------------------
#  Stratum mining (TCP passthrough on 3333) — also load-balanced + health-checked
#-----------------------------------------------------------------------------
frontend stratum_in
    mode tcp
    bind *:3333
    default_backend stratum_nodes

backend stratum_nodes
    mode tcp
    balance leastconn
    option tcp-check
    server node1 node1:3333 check
    server node2 node2:3333 check
    server node3 node3:3333 check
