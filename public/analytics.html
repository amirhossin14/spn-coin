<!DOCTYPE html>
<!--

  Analytics Dashboard.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
  <link rel="icon" type="image/png" sizes="64x64" href="/sepanta-coin.png?v=5">
  <link rel="icon" type="image/png" sizes="32x32" href="/sepanta-coin-32.png?v=5">
  <link rel="shortcut icon" href="/sepanta-coin.ico?v=5">
  <link rel="apple-touch-icon" sizes="180x180" href="/sepanta-coin-180.png?v=5">
  <meta name="theme-color" content="#070a0e">
  <meta name="description" content="SPN Coin analytics — live charts of blocks, transactions, and difficulty.">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Analytics — Sepanta (SPN)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#080b13; --bg2:#0c1120; --card:#0f1626; --bd:rgba(255,255,255,.07);
  --txt:#eaf0fb; --sub:#b3bdd8; --mut:#8a97b8;
  --gold:#f5b301; --grn:#26d07c; --cyn:#25d0ee; --pur:#b06bf7; --pend:#f7c948; --red:#f2555a;
  --r:12px;
}
body{background:var(--bg);color:var(--txt);font-family:'Sora',sans-serif;min-height:100vh;line-height:1.5}
.wrap{max-width:1160px;margin:0 auto;padding:22px 16px 60px}
.head{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;flex-wrap:wrap;gap:12px}
.head h1{font-size:23px;font-weight:700;display:flex;align-items:center;gap:10px}
.head h1 .dot{width:8px;height:8px;border-radius:50%;background:var(--grn);box-shadow:0 0 8px var(--grn);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.wsel{display:flex;gap:6px}
.wsel button{background:var(--card);border:1px solid var(--bd);color:var(--sub);border-radius:8px;
  padding:7px 13px;font-size:12px;cursor:pointer;font-family:'JetBrains Mono',monospace}
.wsel button.on{background:rgba(240,165,0,.15);border-color:var(--gold);color:var(--gold)}

/* KPI cards */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:13px;margin-bottom:22px}
.kpi{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:16px 18px;position:relative;overflow:hidden}
.kpi::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent,var(--gold))}
.kpi .lbl{font-size:11px;color:var(--sub);text-transform:uppercase;letter-spacing:.5px;margin-bottom:7px}
.kpi .val{font-family:'JetBrains Mono',monospace;font-size:22px;font-weight:600;color:var(--accent,var(--gold))}
.kpi .sub{font-size:11px;color:var(--mut);margin-top:4px;font-family:'JetBrains Mono',monospace}

/* chart cards */
.charts{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:820px){.charts{grid-template-columns:1fr}}
.chart{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);overflow:hidden}
.chart-h{padding:13px 18px;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between}
.chart-h .t{font-size:13.5px;font-weight:600}
.chart-h .now{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--accent,var(--gold))}
.chart-b{padding:14px 12px 8px}
svg{display:block;width:100%;height:auto;overflow:visible}
.supply-bar{height:26px;border-radius:6px;background:var(--bg2);overflow:hidden;position:relative;border:1px solid var(--bd)}
.supply-fill{height:100%;background:linear-gradient(90deg,var(--gold),#ffb820);border-radius:6px 0 0 6px;transition:width .6s}
.supply-lbl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:600;color:#000;text-shadow:0 0 4px rgba(255,255,255,.4)}

.state{text-align:center;padding:60px 20px;color:var(--sub)}
.state .ic{font-size:40px;margin-bottom:12px}
.tooltip{position:fixed;background:#000;border:1px solid var(--gold);border-radius:6px;padding:6px 10px;
  font-family:'JetBrains Mono',monospace;font-size:11px;pointer-events:none;opacity:0;transition:opacity .1s;z-index:99;white-space:nowrap}
.legend{display:flex;gap:14px;padding:0 18px 14px;font-size:11px;color:var(--sub);font-family:'JetBrains Mono',monospace}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:3px;border-radius:2px;display:inline-block}
</style>
</head>
<body>
<script src="csrf-fetch.js?v=25"></script>
  <script src="i18n.js?v=34" defer></script>
  <script src="nav.js?v=40" defer></script><script src="/ai-bubble.js?v=5" defer></script>
<script src="/anti-phishing.js?v=1" defer></script>
  <script src="footer.js?v=35" defer></script>
  <script src="ui-prefs.js?v=25" defer></script>
<div class="wrap">
  <div class="head">
    <h1><span class="dot"></span>Network Analytics</h1>
    <div class="wsel" id="wsel">
      <button data-w="25">25</button>
      <button data-w="50" class="on">50</button>
      <button data-w="100">100</button>
      <button data-w="200">200</button>
    </div>
  </div>

  <div id="content">
    <div class="state"><div class="ic">📊</div><div>Loading analytics…</div></div>
  </div>
</div>
<div class="tooltip" id="tip"></div>

<script>
const API=location.origin;
let W=50;

const $=id=>document.getElementById(id);
const tip=$('tip');
function showTip(e,html){tip.innerHTML=html;tip.style.opacity='1';tip.style.left=(e.clientX+12)+'px';tip.style.top=(e.clientY-10)+'px';}
function hideTip(){tip.style.opacity='0';}

function fmtTime(s){
  if(s<60)return s+'s'; if(s<3600)return (s/60).toFixed(1)+'m'; return (s/3600).toFixed(1)+'h';
}
function fmtNum(n){return Number(n).toLocaleString('en');}

async function load(){
  let d;
  try{ d=await fetch(API+'/api/analytics?window='+W).then(r=>r.json()); }
  catch(e){ $('content').innerHTML='<div class="state"><div class="ic">⚠️</div>Failed to load: '+e.message+'</div>'; return; }

  if(!d.series || d.series.length<2){
    $('content').innerHTML='<div class="state"><div class="ic">⛏️</div><div>Not enough blocks yet.</div>'+
      '<div style="font-size:12px;margin-top:8px;color:var(--mut)">Mine a few blocks to see analytics. Current height: '+(d.height||0)+'</div></div>';
    return;
  }

  const s=d.summary, series=d.series;
  const supplyPct = s.circulatingSupply!=null ? (s.circulatingSupply/s.maxSupply*100) : 0;

  $('content').innerHTML=`
    <div class="kpis">
      <div class="kpi" style="--accent:var(--gold)"><div class="lbl">Block Height</div><div class="val">${fmtNum(d.height)}</div><div class="sub">${d.window} blocks analyzed</div></div>
      <div class="kpi" style="--accent:var(--cyn)"><div class="lbl">Avg Block Time</div><div class="val">${fmtTime(s.avgBlockTime)}</div><div class="sub">target ${fmtTime(s.targetBlockTime)}</div></div>
      <div class="kpi" style="--accent:var(--pur)"><div class="lbl">Avg Difficulty</div><div class="val">${s.avgDifficulty}</div><div class="sub">current ${series[series.length-1].difficulty}</div></div>
      <div class="kpi" style="--accent:var(--grn)"><div class="lbl">Avg Tx / Block</div><div class="val">${s.avgTxPerBlock}</div><div class="sub">${fmtNum(s.totalTxInWindow)} tx in window</div></div>
      <div class="kpi" style="--accent:var(--pend)"><div class="lbl">Avg Block Size</div><div class="val">${(s.avgBlockSize/1024).toFixed(1)}<span style="font-size:13px">KB</span></div><div class="sub">${fmtNum(s.avgBlockSize)} bytes</div></div>
    </div>

    <div class="chart" style="margin-bottom:14px">
      <div class="chart-h"><span class="t">💰 Circulating Supply</span><span class="now">${s.circulatingSupply!=null?fmtNum(Math.round(s.circulatingSupply))+' / '+fmtNum(s.maxSupply)+' SPN':'—'}</span></div>
      <div class="chart-b">
        <div class="supply-bar"><div class="supply-fill" style="width:${Math.min(100,supplyPct).toFixed(2)}%"></div>
        <div class="supply-lbl">${supplyPct.toFixed(4)}% mined</div></div>
      </div>
    </div>

    <div class="charts">
      <div class="chart">
        <div class="chart-h"><span class="t">⏱️ Block Time</span><span class="now">${fmtTime(series[series.length-1].blockTime)}</span></div>
        <div class="chart-b" id="c-blocktime"></div>
        <div class="legend"><span><i style="background:var(--cyn)"></i>seconds per block</span><span><i style="background:var(--mut)"></i>target</span></div>
      </div>
      <div class="chart">
        <div class="chart-h"><span class="t">⚙️ Difficulty</span><span class="now">${series[series.length-1].difficulty}</span></div>
        <div class="chart-b" id="c-difficulty"></div>
      </div>
      <div class="chart">
        <div class="chart-h"><span class="t">📦 Transactions / Block</span><span class="now">${series[series.length-1].txCount}</span></div>
        <div class="chart-b" id="c-tx"></div>
      </div>
      <div class="chart">
        <div class="chart-h"><span class="t">📏 Block Size</span><span class="now">${(series[series.length-1].size/1024).toFixed(1)} KB</span></div>
        <div class="chart-b" id="c-size"></div>
      </div>
    </div>`;

  drawLine('c-blocktime', series.map(x=>x.blockTime), 'var(--cyn)', s.targetBlockTime, v=>fmtTime(v)+'/blk');
  drawLine('c-difficulty', series.map(x=>x.difficulty), 'var(--pur)', null, v=>'diff '+v);
  drawBars('c-tx', series.map(x=>x.txCount), 'var(--grn)', v=>v+' tx');
  drawBars('c-size', series.map(x=>x.size/1024), 'var(--pend)', v=>v.toFixed(1)+' KB');
}

// ── line chart (SVG) ──
function drawLine(id, data, color, target, fmt){
  const W_=520,H_=150,P=8;
  const max=Math.max(...data,target||0)*1.15||1, min=0;
  const xs=i=>P+(i/(data.length-1||1))*(W_-2*P);
  const ys=v=>H_-P-((v-min)/(max-min||1))*(H_-2*P);
  const pts=data.map((v,i)=>xs(i)+','+ys(v)).join(' ');
  const area=`${P},${H_-P} ${pts} ${W_-P},${H_-P}`;
  let tline='';
  if(target){ const ty=ys(target); tline=`<line x1="${P}" y1="${ty}" x2="${W_-P}" y2="${ty}" stroke="var(--mut)" stroke-width="1" stroke-dasharray="4 4"/>`; }
  const dots=data.map((v,i)=>`<circle cx="${xs(i)}" cy="${ys(v)}" r="7" fill="transparent" data-v="${v}" data-i="${i}"/>`).join('');
  $(id).innerHTML=`<svg viewBox="0 0 ${W_} ${H_}">
    <defs><linearGradient id="g${id}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${color}" stop-opacity=".28"/><stop offset="100%" stop-color="${color}" stop-opacity="0"/>
    </linearGradient></defs>
    <polygon points="${area}" fill="url(#g${id})"/>
    ${tline}
    <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round"/>
    ${dots}
  </svg>`;
  bindHover(id,data,fmt);
}

// ── bar chart (SVG) ──
function drawBars(id, data, color, fmt){
  const W_=520,H_=150,P=8;
  const max=Math.max(...data,1)*1.15;
  const bw=(W_-2*P)/data.length;
  const bars=data.map((v,i)=>{
    const h=((v/max)*(H_-2*P))||0.5;
    return `<rect x="${P+i*bw+bw*0.15}" y="${H_-P-h}" width="${bw*0.7}" height="${h}" rx="2" fill="${color}" opacity=".82" data-v="${v}" data-i="${i}"/>`;
  }).join('');
  $(id).innerHTML=`<svg viewBox="0 0 ${W_} ${H_}">${bars}</svg>`;
  bindHover(id,data,fmt);
}

function bindHover(id,data,fmt){
  $(id).querySelectorAll('[data-i]').forEach(el=>{
    el.style.cursor='crosshair';
    el.addEventListener('mouseenter',e=>{const i=+el.dataset.i;showTip(e,`<b style="color:var(--gold)">${fmt(+el.dataset.v)}</b>`);el.setAttribute('opacity','1');});
    el.addEventListener('mousemove',e=>showTip(e,tip.innerHTML));
    el.addEventListener('mouseleave',()=>{hideTip();if(el.tagName==='rect')el.setAttribute('opacity','.82');});
  });
}

$('wsel').addEventListener('click',e=>{
  const b=e.target.closest('[data-w]'); if(!b)return;
  document.querySelectorAll('#wsel button').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); W=+b.dataset.w; load();
});

load();
setInterval(load, 15000); // refresh every 15s
</script>
</body>
</html>
