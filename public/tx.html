<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" sizes="64x64" href="/sepanta-coin.png?v=5">
  <link rel="icon" type="image/png" sizes="32x32" href="/sepanta-coin-32.png?v=5">
  <link rel="shortcut icon" href="/sepanta-coin.ico?v=5">
  <link rel="apple-touch-icon" sizes="180x180" href="/sepanta-coin-180.png?v=5">
<meta name="theme-color" content="#080b13">
<meta name="description" content="Inspect SPN Coin transaction details — inputs, outputs, fee, and confirmations.">
<title>Transaction Details — Sepanta (SPN) Explorer</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#080b13;--bg2:#0c1120;--card:#0f1626;--raised:#141d31;--bd:rgba(255,255,255,.08);--bd2:rgba(148,163,208,.14);--txt:#eaf0fb;--sub:#b3bdd8;--mut:#8a97b8;--grn:#26d07c;--red:#f2555a;--gold:#f5b301;--cyn:#25d0ee;--pur:#b06bf7;--r:16px}
[data-theme="light"]{--bg:#f4f6fb;--bg2:#e9edf5;--card:#fff;--raised:#f0f2f8;--txt:#1a2238;--sub:#5a6588;--mut:#9aa4c0;--bd:rgba(0,0,0,.1)}
body{font-family:'Sora',sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;line-height:1.5}
.wrap{max-width:920px;margin:0 auto;padding:32px 20px 60px}
.hero{margin-bottom:24px}
.hero h1{font-size:26px;font-weight:800;display:flex;align-items:center;gap:11px}
.hero .lead{color:var(--sub);font-size:14px;margin-top:4px}
.searchbar{display:flex;gap:10px;margin:18px 0 24px}
.searchbar input{flex:1;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:13px 16px;color:var(--txt);font-family:'JetBrains Mono',monospace;font-size:13px;outline:none}
.searchbar input:focus{border-color:var(--bd2)}
.searchbar button{background:var(--gold);color:#000;border:none;border-radius:12px;padding:13px 22px;font-weight:700;cursor:pointer;font-family:inherit}
.status-badge{display:inline-flex;align-items:center;gap:8px;padding:7px 16px;border-radius:100px;font-size:13px;font-weight:700;margin-bottom:20px}
.status-badge.confirmed{background:rgba(0,230,118,.13);color:var(--grn)}
.status-badge.pending{background:rgba(245,179,1,.12);color:var(--gold)}
.status-badge .d{width:8px;height:8px;border-radius:50%;background:currentColor}
.status-badge.confirmed .d{animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(0,230,118,.5)}70%{box-shadow:0 0 0 7px rgba(0,230,118,0)}100%{box-shadow:0 0 0 0}}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
@media(max-width:720px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:16px;transition:.15s}
.stat:hover{border-color:var(--bd2);transform:translateY(-2px)}
.stat .l{font-size:11px;color:var(--sub);text-transform:uppercase;letter-spacing:.5px;font-weight:600}
.stat .v{font-family:'JetBrains Mono',monospace;font-size:20px;font-weight:700;margin-top:7px}
.stat .v.gold{color:var(--gold)}.stat .v.grn{color:var(--grn)}.stat .v.cyn{color:var(--cyn)}.stat .v.pur{color:var(--pur)}
.panel{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:22px;margin-bottom:16px}
.panel h2{font-size:14px;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:9px;text-transform:uppercase;letter-spacing:.5px;color:var(--sub)}
.hashrow{display:flex;align-items:center;gap:10px;background:var(--bg2);border:1px solid var(--bd);border-radius:10px;padding:12px 14px;font-family:'JetBrains Mono',monospace;font-size:13px;word-break:break-all}
.hashrow .copy{margin-inline-start:auto;background:transparent;border:1px solid var(--bd);border-radius:7px;padding:5px 10px;color:var(--sub);cursor:pointer;font-size:12px;flex-shrink:0}
.hashrow .copy:hover{color:var(--gold);border-color:var(--gold)}
.row{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--bd);font-size:13.5px;gap:14px}
.row:last-child{border-bottom:none}
.row .k{color:var(--sub);flex-shrink:0}
.row .v{font-family:'JetBrains Mono',monospace;font-weight:600;text-align:end;word-break:break-all}
.row .v a{color:var(--cyn);text-decoration:none}
.row .v a:hover{text-decoration:underline}
.io{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:start}
@media(max-width:720px){.io{grid-template-columns:1fr}}
.io-col h3{font-size:12px;color:var(--sub);text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px;display:flex;align-items:center;gap:7px}
.io-item{background:var(--bg2);border:1px solid var(--bd);border-radius:10px;padding:12px 14px;margin-bottom:10px}
.io-item .addr{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--txt);word-break:break-all}
.io-item .amt{font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:700;color:var(--gold);margin-top:5px}
.io-arrow{display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--mut);padding-top:30px}
@media(max-width:720px){.io-arrow{padding:6px;transform:rotate(90deg)}}
.coinbase-badge{display:inline-block;background:rgba(167,139,250,.15);color:var(--pur);font-size:11px;font-weight:700;padding:2px 9px;border-radius:100px;margin-inline-start:8px}
.fee-explain{font-size:12px;color:var(--sub);margin-top:12px;line-height:1.6;padding:12px 14px;background:rgba(34,211,238,.05);border:1px solid rgba(34,211,238,.15);border-radius:10px}
.loading,.error{text-align:center;padding:50px 20px;color:var(--mut)}
.error{color:var(--red)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--grn);color:#000;padding:11px 22px;border-radius:10px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:.3s;z-index:9999}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
[dir="rtl"]{direction:rtl}
[dir="rtl"] .row .v{text-align:start}
.lt-list{display:flex;flex-direction:column;gap:10px}
.lt-row{display:flex;align-items:center;gap:16px;background:rgba(255,255,255,.02);
  border:1px solid rgba(255,255,255,.07);border-radius:14px;padding:14px 18px;
  text-decoration:none;transition:.15s;color:inherit}
.lt-row:hover{border-color:rgba(240,180,60,.4);background:rgba(255,255,255,.04)}
.lt-tag{background:rgba(240,180,60,.15);color:#f0b43c;font-weight:700;font-size:12px;
  padding:6px 11px;border-radius:9px;white-space:nowrap;letter-spacing:.5px}
.lt-tag.cb{background:rgba(45,200,150,.15);color:#2dc896}
.lt-mid{flex:1;min-width:0}
.lt-hash{font-family:'JetBrains Mono',monospace;color:#f0b43c;font-size:14px;overflow-wrap:anywhere}
.lt-sub{color:#8a93a3;font-size:12.5px;margin-top:3px;font-family:'JetBrains Mono',monospace;overflow-wrap:anywhere}
.lt-amt{font-family:'JetBrains Mono',monospace;color:#e8edf4;font-weight:600;text-align:right;white-space:nowrap}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <h1>🔗 <span data-i18n>Transaction Details</span></h1>
    <div class="lead" data-i18n>Inspect a transaction's inputs, outputs, fee and confirmations.</div>
  </div>

  <div class="searchbar">
    <input id="txSearch" placeholder="Transaction hash…" spellcheck="false">
    <button onclick="goSearch()" data-i18n>Search</button>
  </div>

  <div id="content"><div class="loading" data-i18n>Loading transaction…</div></div>
</div>

<div class="toast" id="toast"></div>

<script src="csrf-fetch.js?v=27"></script>
<script src="i18n.js?v=34"></script>
<script src="nav.js?v=40"></script><script src="/ai-bubble.js?v=5" defer></script>
<script src="/anti-phishing.js?v=1" defer></script>
<script src="footer.js?v=35"></script>
<script src="ui-prefs.js?v=25"></script>
<script>
const API = window.SPN_COIN_API || (location.hostname==='localhost'||location.hostname==='127.0.0.1' ? 'http://localhost:3000' : location.origin);
const $ = id => document.getElementById(id);
const params = new URLSearchParams(location.search);
const TXID = params.get('h') || params.get('id') || params.get('tx') || '';

function fmtSPN(sat){ if(sat==null)return '—'; const n=Number(sat)/1e8; return n.toLocaleString(undefined,{maximumFractionDigits:8})+' SPN'; }
function fmtRaw(v){ // amounts may already be SPN or satoshi strings
  if(v==null)return '—';
  const num=Number(v);
  if(isNaN(num))return String(v);
  // Heuristic: large integers are satoshis, small are SPN
  return (num>=1e6 ? (num/1e8) : num).toLocaleString(undefined,{maximumFractionDigits:8})+' SPN';
}
function shortHash(h){ return h ? h.slice(0,16)+'…'+h.slice(-8) : '—'; }
function ago(ts){ if(!ts)return '—'; const s=Math.floor(Date.now()/1000-ts); if(s<0)return 'just now'; if(s<60)return s+'s ago'; if(s<3600)return Math.floor(s/60)+'m ago'; if(s<86400)return Math.floor(s/3600)+'h ago'; return Math.floor(s/86400)+'d ago'; }
function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1800); }
function copy(text){ navigator.clipboard.writeText(text).then(()=>toast(SPNi18n&&SPNi18n.get()==='fa'?'کپی شد':'Copied!')); }
function goSearch(){ const v=$('txSearch').value.trim(); if(v) location.href='tx?h='+encodeURIComponent(v); }
$('txSearch')&&$('txSearch').addEventListener('keydown',e=>{if(e.key==='Enter')goSearch();});

function tr(en){ return (window.SPNi18n && SPNi18n.get()==='fa' && SPNi18n.dict[en]) ? SPNi18n.dict[en] : en; }

async function loadList(){
  try{
    const r = await fetch(API+'/api/blocks?limit=20');
    const d = await r.json();
    const blocks = d.blocks || [];
    const txs=[];
    for(const b of blocks){
      for(const tx of (b.transactions||[])){
        const outs=tx.outputs||[]; const to=outs[0]?outs[0].address:'—';
        const amount=outs.reduce((s,o)=>s+Number(o.amount||0),0);
        const from = tx.isCoinbase ? 'coinbase' : ((tx.inputs&&tx.inputs[0]&&tx.inputs[0].address)|| '—');
        txs.push({id:tx.id,coinbase:!!tx.isCoinbase,to,from,amount,height:b.height});
      }
    }
    const list=txs.slice(0,30);
    if(!list.length){ $('content').innerHTML='<div class="error">No transfers yet.</div>'; return; }
    $('content').innerHTML =
      '<h2 style="font-family:\'Fraunces\',serif;margin:0 0 18px">Latest transfers</h2>'+
      '<div class="lt-list">'+list.map(t=>
        '<a class="lt-row" href="tx?h='+t.id+'">'+
          '<span class="lt-tag '+(t.coinbase?'cb':'')+'">'+(t.coinbase?'MINT':'XFER')+'</span>'+
          '<div class="lt-mid"><div class="lt-hash">'+shortHash(t.id)+'</div>'+
          '<div class="lt-sub">'+(t.from==='coinbase'?'coinbase':shortHash(t.from))+' → '+shortHash(t.to)+'</div></div>'+
          '<div class="lt-amt">'+fmtRaw(t.amount)+'<div class="lt-sub" style="text-align:right">#'+t.height+'</div></div>'+
        '</a>').join('')+'</div>';
  }catch(e){
    $('content').innerHTML='<div class="error">Can’t reach the node API.</div>';
  }
}

async function load(){
  if(!TXID){ loadList(); return; }
  try{
    const r = await fetch(API+'/api/tx/'+TXID);
    if(!r.ok){
      if(r.status===404){ $('content').innerHTML='<div class="error" data-i18n>Transaction not found.</div>'; }
      else{ $('content').innerHTML='<div class="error" data-i18n>Could not load transaction.</div>'; }
      if(window.SPNi18n)SPNi18n.refresh();
      return;
    }
    const tx = await r.json();
    render(tx);
  }catch(e){
    $('content').innerHTML='<div class="error" data-i18n>Connection error.</div>';
    if(window.SPNi18n)SPNi18n.refresh();
  }
}

function render(tx){
  const isCoinbase = tx.isCoinbase;
  const confirmed = tx.status==='confirmed';
  const inputs = tx.inputs||[];
  const outputs = tx.outputs||[];
  const outTotal = outputs.reduce((s,o)=>s+Number(o.amount||0),0);
  const feeStr = fmtRaw(tx.fee||0);

  // status badge
  const badge = confirmed
    ? '<div class="status-badge confirmed"><span class="d"></span>'+tr('Confirmed')+'</div>'
    : '<div class="status-badge pending"><span class="d"></span>'+tr('Pending')+'</div>';

  // stat cards
  const stats =
    '<div class="stats">'+
      '<div class="stat"><div class="l">'+tr('Amount')+'</div><div class="v gold">'+fmtRaw(outTotal)+'</div></div>'+
      '<div class="stat"><div class="l">'+tr('Network fee')+'</div><div class="v cyn">'+feeStr+'</div></div>'+
      '<div class="stat"><div class="l">'+tr('Confirmations')+'</div><div class="v grn">'+(tx.confirmations!=null?tx.confirmations:'—')+'</div></div>'+
      '<div class="stat"><div class="l">'+tr('Block')+'</div><div class="v pur">'+(tx.blockHeight!=null?('#'+tx.blockHeight):'—')+'</div></div>'+
    '</div>';

  // hash
  const hashPanel =
    '<div class="panel"><h2>🔑 '+tr('Transaction Hash')+(isCoinbase?'<span class="coinbase-badge">COINBASE</span>':'')+'</h2>'+
      '<div class="hashrow"><span>'+tx.id+'</span><button class="copy" onclick="copy(\''+tx.id+'\')">'+tr('Copy')+'</button></div></div>';

  // details
  const details =
    '<div class="panel"><h2>📋 '+tr('Details')+'</h2>'+
      '<div class="row"><span class="k">'+tr('Status')+'</span><span class="v">'+(confirmed?tr('Confirmed'):tr('Pending'))+'</span></div>'+
      '<div class="row"><span class="k">'+tr('Block')+'</span><span class="v">'+(tx.blockHeight!=null?'<a href="block?h='+tx.blockHeight+'">#'+tx.blockHeight+'</a>':'—')+'</span></div>'+
      '<div class="row"><span class="k">'+tr('Timestamp')+'</span><span class="v">'+(tx.timestamp?new Date(tx.timestamp*1000).toLocaleString()+' ('+ago(tx.timestamp)+')':'—')+'</span></div>'+
      '<div class="row"><span class="k">'+tr('Network fee')+'</span><span class="v">'+feeStr+'</span></div>'+
      '<div class="row"><span class="k">'+tr('Size')+'</span><span class="v">'+(tx.size||JSON.stringify(tx).length)+' B</span></div>'+
      (isCoinbase?'':'<div class="fee-explain">'+tr('The network fee goes to the miner who included this transaction in a block — it is not returned to the sender.')+'</div>')+
    '</div>';

  // inputs / outputs
  const inCol = isCoinbase
    ? '<div class="io-item"><div class="addr">'+tr('Newly minted coins (block reward)')+'</div></div>'
    : (inputs.length ? inputs.map(i=>'<div class="io-item"><div class="addr">'+(i.address||i.txid||tr('Unknown'))+'</div>'+(i.amount!=null?'<div class="amt">'+fmtRaw(i.amount)+'</div>':'')+'</div>').join('')
       : '<div class="io-item"><div class="addr">'+tr('No inputs')+'</div></div>');

  const outCol = outputs.length ? outputs.map(o=>'<div class="io-item"><div class="addr">'+(o.address||tr('Unknown'))+'</div><div class="amt">'+fmtRaw(o.amount)+'</div></div>').join('')
       : '<div class="io-item"><div class="addr">'+tr('No outputs')+'</div></div>';

  const io =
    '<div class="panel"><h2>💸 '+tr('Inputs & Outputs')+'</h2>'+
      '<div class="io">'+
        '<div class="io-col"><h3>📥 '+tr('Inputs')+' ('+(isCoinbase?1:inputs.length)+')</h3>'+inCol+'</div>'+
        '<div class="io-arrow">→</div>'+
        '<div class="io-col"><h3>📤 '+tr('Outputs')+' ('+outputs.length+')</h3>'+outCol+'</div>'+
      '</div></div>';

  $('content').innerHTML = badge + stats + hashPanel + details + io;
  if(window.SPNi18n) SPNi18n.refresh();
}

load();
document.addEventListener('spn-lang-change', ()=>load());
</script>
</body>
</html>
