function render(lang) {
  const c = CONTENT[lang];
  const rtl = lang === 'fa';
  document.documentElement.dir = rtl ? 'rtl' : 'ltr';
  document.getElementById('pageTitle').textContent = c.title;
  document.getElementById('pageLead').textContent = c.lead;
  document.getElementById('pageUpdated').textContent = c.updated;
  document.getElementById('backLink').textContent = c.back;

  let html = '';
  // Owner notice highlighted at top
  html += '<div class="warn"><strong>⚠️ ' + (rtl ? 'اعلان مالکیت' : 'Ownership Notice') + '</strong><br>'
    + (rtl
        ? 'تمام حقوق مادی و معنوی این پروژه متعلق به مالک پروژه است و حق کپی‌رایت فقط با اجازه‌ی مالک و درج منبع مجاز است. کپی‌برداری از سایت یا استفاده از اطلاعات دیگران پیگرد قانونی دارد.'
        : 'All material and intellectual property rights of this project belong to the project owner. Copyright use is permitted only with the owner\'s permission and with source attribution. Copying from the site or using others\' information is subject to legal prosecution.')
    + '</div>';

  for (const s of c.sections) {
    html += '<div class="card"><h2><span class="num">' + s.n + '</span>' + esc(s.h) + '</h2>';
    for (const p of (s.p || [])) html += '<p>' + esc(p) + '</p>';
    if (s.ul) { html += '<ul>'; for (const li of s.ul) html += '<li>' + esc(li) + '</li>'; html += '</ul>'; }
    html += '</div>';
  }
  document.getElementById('content').innerHTML = html;
  document.getElementById('btnEn').classList.toggle('active', lang === 'en');
  document.getElementById('btnFa').classList.toggle('active', lang === 'fa');
}

function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function setLang(l){ try{ localStorage.setItem('spn_lang', l); }catch(e){} render(l); }

// initial language: saved pref, else browser, else English
let initial = 'en';
try { initial = localStorage.getItem('spn_lang') || (navigator.language||'').startsWith('fa') ? 'fa' : 'en'; } catch(e){}
if (initial !== 'fa') initial = 'en';
render(initial);
</script>
